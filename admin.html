
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রঙচিল Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f0fa;padding:15px;color:#222}
.container{max-width:650px;margin:auto}
.card{background:white;padding:18px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}
h2,h3{color:#6b268c}
input,textarea,select,button{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:7px;font-size:15px}
button{background:#762d91;color:white;border:0;cursor:pointer;font-weight:bold}
button.danger{background:#c62828}
button.secondary{background:#555}
button:disabled{opacity:.5}
.item{border:1px solid #ddd;padding:12px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}
.small{font-size:13px;color:#555;line-height:1.7}
.msg{font-size:14px;margin:8px 0;overflow-wrap:anywhere}
img.product{width:90px;height:90px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
</style>
</head>
<body>
<div class="container">

<div class="card">
<h2>রঙচিল Admin Panel</h2>
<p id="connectionMsg" class="msg">সংযোগ পরীক্ষা হচ্ছে...</p>
</div>

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" onclick="login()">লগইন করুন</button>
<p id="loginMsg" class="msg"></p>
</div>

<div id="panel" style="display:none">

<div class="card">
<div class="row">
<h3>Dashboard</h3>
<button class="secondary" onclick="logout()">Logout</button>
</div>
</div>

<div class="card">
<h3>নতুন পণ্য যোগ করুন</h3>
<input id="name" placeholder="পণ্যের নাম">
<textarea id="description" placeholder="পণ্যের বিবরণ"></textarea>
<div class="row">
<input id="price" type="number" placeholder="দাম">
<input id="stock" type="number" placeholder="স্টক">
</div>
<input id="category" placeholder="ক্যাটাগরি">
<label>পণ্যের ছবি</label>
<input id="image" type="file" accept="image/*">
<button id="addBtn" onclick="addProduct()">পণ্য যোগ করুন</button>
<p id="productMsg" class="msg"></p>
</div>

<div class="card">
<h3>পণ্যের তালিকা</h3>
<button class="secondary" onclick="loadProducts()">রিফ্রেশ করুন</button>
<div id="productList">লোড হচ্ছে...</div>
</div>

<div class="card">
<h3>অর্ডার তালিকা</h3>
<button class="secondary" onclick="loadOrders()">অর্ডার রিফ্রেশ করুন</button>
<div id="orderList">লোড হচ্ছে...</div>
</div>

</div>
</div>

<script>
const SUPABASE_URL="https://fstxhzsvvzthqqcisfdz.supabase.co";
const SUPABASE_KEY="sb_publishable_k8cAOGYerAOOFsf_UghhyQ_WfVu8buP";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET="product-media";

const $=id=>document.getElementById(id);

function showMessage(id,message,color="#333"){
$(id).textContent=message;
$(id).style.color=color;
}

async function checkConnection(){
try{
const {error}=await db.from("products").select("id").limit(1);
if(error) throw error;
showMessage("connectionMsg","Supabase সংযোগ সফল হয়েছে","#16803c");
}catch(e){
showMessage("connectionMsg","সংযোগ সমস্যা: "+e.message,"#c62828");
}
}

async function login(){
const email=$("email").value.trim();
const password=$("password").value;

if(!email||!password){
showMessage("loginMsg","ইমেইল ও পাসওয়ার্ড দিন","#c62828");
return;
}

$("loginBtn").disabled=true;
showMessage("loginMsg","লগইন হচ্ছে...");

try{
const {error}=await db.auth.signInWithPassword({email,password});
if(error) throw error;
showPanel();
}catch(e){
showMessage("loginMsg","লগইন হয়নি: "+e.message,"#c62828");
}finally{
$("loginBtn").disabled=false;
}
}

async function logout(){
await db.auth.signOut();
$("panel").style.display="none";
$("loginBox").style.display="block";
$("password").value="";
}

async function showPanel(){
$("loginBox").style.display="none";
$("panel").style.display="block";
await loadProducts();
await loadOrders();
}

async function uploadImage(file){
if(!file) return null;

const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;

const {error}=await db.storage.from(BUCKET).upload(path,file,{
cacheControl:"3600",
upsert:false
});

if(error) throw error;

const {data}=db.storage.from(BUCKET).getPublicUrl(path);
return data.publicUrl;
}

async function addProduct(){
const name=$("name").value.trim();
const description=$("description").value.trim();
const price=Number($("price").value);
const stock=Number($("stock").value);
const category=$("category").value.trim();
const file=$("image").files[0];

if(!name||!Number.isFinite(price)||price<=0||!Number.isInteger(stock)||stock<0){
showMessage("productMsg","নাম, সঠিক দাম ও স্টক দিন","#c62828");
return;
}

$("addBtn").disabled=true;
showMessage("productMsg","পণ্য যোগ হচ্ছে...");

try{
let image_url=null;
if(file) image_url=await uploadImage(file);

const {error}=await db.from("products").insert([{
name,description,price,stock,category,image_url
}]);

if(error) throw error;

showMessage("productMsg","পণ্য সফলভাবে যোগ হয়েছে","#16803c");
["name","description","price","stock","category","image"].forEach(id=>$(id).value="");
await loadProducts();

}catch(e){
showMessage("productMsg","সমস্যা: "+e.message,"#c62828");
}finally{
$("addBtn").disabled=false;
}
}

function makeText(tag,text,className=""){
const el=document.createElement(tag);
el.textContent=text??"";
if(className) el.className=className;
return el;
}

async function loadProducts(){
const list=$("productList");
list.textContent="লোড হচ্ছে...";

const {data,error}=await db.from("products").select("*").order("id",{ascending:false});

if(error){
list.textContent="পণ্য লোড হয়নি: "+error.message;
return;
}

list.innerHTML="";

if(!data||!data.length){
list.textContent="কোনো পণ্য নেই";
return;
}

data.forEach(p=>{
const box=makeText("div","");
box.className="item";

if(p.image_url){
const img=document.createElement("img");
img.src=p.image_url;
img.className="product";
img.alt="Product";
box.appendChild(img);
}

box.appendChild(makeText("h3",p.name));
box.appendChild(makeText("p","দাম: ৳"+p.price+" | স্টক: "+p.stock,"small"));
box.appendChild(makeText("p","ক্যাটাগরি: "+(p.category||"-"),"small"));
box.appendChild(makeText("p",p.description||"","small"));

const edit=document.createElement("button");
edit.textContent="এডিট করুন";
edit.onclick=()=>editProduct(p);
box.appendChild(edit);

const del=document.createElement("button");
del.textContent="ডিলিট করুন";
del.className="danger";
del.onclick=()=>deleteProduct(p.id);
box.appendChild(del);

list.appendChild(box);
});
}

async function editProduct(p){
const name=prompt("পণ্যের নাম:",p.name);
if(name===null)return;

const price=prompt("দাম:",p.price);
if(price===null)return;

const stock=prompt("স্টক:",p.stock);
if(stock===null)return;

const category=prompt("ক্যাটাগরি:",p.category||"");
if(category===null)return;

const description=prompt("বিবরণ:",p.description||"");
if(description===null)return;

const newPrice=Number(price);
const newStock=Number(stock);

if(!name.trim()||!Number.isFinite(newPrice)||newPrice<=0||
!Number.isInteger(newStock)||newStock<0){
alert("সঠিক তথ্য দিন");
return;
}

const {error}=await db.from("products").update({
name:name.trim(),
price:newPrice,
stock:newStock,
category:category.trim(),
description:description.trim()
}).eq("id",p.id);

if(error){
alert("আপডেট হয়নি: "+error.message);
return;
}

alert("পণ্য আপডেট হয়েছে");
await loadProducts();
}

async function deleteProduct(id){
if(!confirm("পণ্যটি ডিলিট করতে চান?"))return;

const {error}=await db.from("products").delete().eq("id",id);

if(error){
alert("ডিলিট হয়নি: "+error.message);
return;
}

alert("পণ্য ডিলিট হয়েছে");
await loadProducts();
}

async function loadOrders(){
const list=$("orderList");
list.textContent="অর্ডার লোড হচ্ছে...";

const {data,error}=await db.from("orders").select("*").order("id",{ascending:false});

if(error){
list.textContent="অর্ডার লোড হয়নি: "+error.message;
return;
}

list.innerHTML="";

if(!data||!data.length){
list.textContent="কোনো অর্ডার নেই";
return;
}

data.forEach(o=>{
const box=document.createElement("div");
box.className="item";

box.appendChild(makeText("h3","অর্ডার #"+o.id));
box.appendChild(makeText("p","গ্রাহক: "+(o.customer_name||"-"),"small"));
box.appendChild(makeText("p","ফোন: "+(o.phone||"-"),"small"));
box.appendChild(makeText("p","ঠিকানা: "+(o.address||"-"),"small"));
box.appendChild(makeText("p","পণ্য ID: "+(o.product_id??"-"),"small"));
box.appendChild(makeText("p","পরিমাণ: "+(o.quantity??"-"),"small"));
box.appendChild(makeText("p","মোট টাকা: ৳"+(o.total_amount??"-"),"small"));

box.appendChild(makeText("p","পেমেন্ট পদ্ধতি: "+(o.payment_method||"ক্যাশ অন ডেলিভারি"),"small"));
box.appendChild(makeText("p","Transaction ID: "+(o.transaction_id||"নেই"),"small"));

box.appendChild(makeText("h4","পেমেন্ট যাচাই"));

const paymentSelect=document.createElement("select");

["অপেক্ষমাণ","পরিশোধিত","ব্যর্থ"].forEach(v=>{
const option=document.createElement("option");
option.value=v;
option.textContent=v;
paymentSelect.appendChild(option);
});

paymentSelect.value=o.payment_status||"অপেক্ষমাণ";
box.appendChild(paymentSelect);

const paymentBtn=document.createElement("button");
paymentBtn.textContent="পেমেন্ট স্ট্যাটাস সেভ করুন";
paymentBtn.onclick=async()=>{
paymentBtn.disabled=true;
const {error}=await db.from("orders").update({
payment_status:paymentSelect.value
}).eq("id",o.id);

paymentBtn.disabled=false;

if(error){
alert("পেমেন্ট স্ট্যাটাস সেভ হয়নি: "+error.message);
return;
}
alert("পেমেন্ট স্ট্যাটাস আপডেট হয়েছে");
await loadOrders();
};
box.appendChild(paymentBtn);

box.appendChild(makeText("h4","অর্ডার স্ট্যাটাস"));

const statusSelect=document.createElement("select");
["নতুন","নিশ্চিত","প্রস্তুত","পাঠানো","সম্পন্ন","বাতিল"].forEach(v=>{
const option=document.createElement("option");
option.value=v;
option.textContent=v;
statusSelect.appendChild(option);
});

statusSelect.value=o.status||"নতুন";
box.appendChild(statusSelect);

const statusBtn=document.createElement("button");
statusBtn.textContent="অর্ডার স্ট্যাটাস সেভ করুন";
statusBtn.className="secondary";

statusBtn.onclick=async()=>{
statusBtn.disabled=true;
const {error}=await db.from("orders").update({
status:statusSelect.value
}).eq("id",o.id);

statusBtn.disabled=false;

if(error){
alert("অর্ডার স্ট্যাটাস সেভ হয়নি: "+error.message);
return;
}

alert("অর্ডার স্ট্যাটাস আপডেট হয়েছে");
await loadOrders();
};

box.appendChild(statusBtn);
list.appendChild(box);
});
}

async function checkLogin(){
const {data}=await db.auth.getSession();
if(data.session){
await showPanel();
}else{
$("loginBox").style.display="block";
$("panel").style.display="none";
}
}

checkConnection();
checkLogin();
</script>
</body>
</html>
