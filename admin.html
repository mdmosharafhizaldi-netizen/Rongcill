
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রঙচিল Admin Panel</title>
<style>
body{font-family:Arial;background:#f5f0fa;padding:20px;color:#222}
.container{max-width:500px;margin:auto;background:white;padding:20px;border-radius:12px}
h2{text-align:center;color:#7027a0}
input,textarea,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
button{background:#7027a0;color:white;border:0;font-size:16px}
.product{padding:12px;border:1px solid #ddd;margin:12px 0;border-radius:8px}
.product img{max-width:100%;max-height:150px;object-fit:contain}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h2>রঙচিল Admin Panel</h2>

<div id="login">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="আপনার Gmail">
<input id="password" type="password" placeholder="পাসওয়ার্ড">
<button onclick="login()">লগইন করুন</button>
<p id="loginMsg"></p>
</div>

<div id="panel" class="hidden">
<p>আপনি Admin হিসেবে লগইন করেছেন।</p>
<button onclick="logout()">লগআউট</button>
<hr>
<h3>নতুন পণ্য যোগ করুন</h3>
<input id="name" placeholder="পণ্যের নাম">
<textarea id="description" placeholder="পণ্যের বিবরণ"></textarea>
<input id="price" type="number" placeholder="পণ্যের দাম">
<input id="category" placeholder="ক্যাটাগরি">
<label>পণ্যের ছবি নির্বাচন করুন</label>
<input id="photo" type="file" accept="image/*">
<button onclick="addProduct()">পণ্য যোগ করুন</button>
<p id="msg"></p>
<hr>
<h3>পণ্যের তালিকা</h3>
<div id="products">লোড হচ্ছে...</div>
</div>
</div>
<hr>
<h3>কাস্টমারের অর্ডার</h3>
<button onclick="loadOrders()">অর্ডার রিফ্রেশ করুন</button>
<div id="orders">অর্ডার লোড হচ্ছে...</div>
<script type="module">
import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
'https://fstxhzsvvzthqqcisfdz.supabase.co',
'sb_publishable_k8cAOGYerAOOFsf_UghhyQ_WfVu8buP'
);

window.login=async function(){
const email=document.getElementById('email').value.trim();
const password=document.getElementById('password').value;
const msg=document.getElementById('loginMsg');
msg.textContent='লগইন হচ্ছে...';

const {error}=await supabase.auth.signInWithPassword({email,password});
if(error){msg.textContent='লগইন হয়নি: '+error.message;return;}
await showPanel();
};

async function showPanel(){
document.getElementById('login').classList.add('hidden');
document.getElementById('panel').classList.remove('hidden');
await loadProducts();
}
await window.loadOrders();
window.logout=async function(){
await supabase.auth.signOut();
document.getElementById('panel').classList.add('hidden');
document.getElementById('login').classList.remove('hidden');
};

window.addProduct=async function(){
const msg=document.getElementById('msg');
msg.textContent='পণ্য যোগ হচ্ছে...';

const name=document.getElementById('name').value.trim();
const description=document.getElementById('description').value.trim();
const price=Number(document.getElementById('price').value||0);
const category=document.getElementById('category').value.trim();
const photo=document.getElementById('photo').files[0];
let image_url=null;

if(!name){msg.textContent='পণ্যের নাম লিখুন।';return;}

if(photo){
const safeName=Date.now()+'-'+photo.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const {error:uploadError}=await supabase.storage.from('product-media').upload(safeName,photo);
if(uploadError){msg.textContent='ছবি আপলোড হয়নি: '+uploadError.message;return;}
image_url=supabase.storage.from('product-media').getPublicUrl(safeName).data.publicUrl;
}

const {error}=await supabase.from('products').insert([{
name,description,price,category,image_url,is_active:true
}]);

if(error){msg.textContent='পণ্য যোগ হয়নি: '+error.message;return;}

msg.textContent='পণ্য সফলভাবে যোগ হয়েছে!';
document.getElementById('name').value='';
document.getElementById('description').value='';
document.getElementById('price').value='';
document.getElementById('category').value='';
document.getElementById('photo').value='';
await loadProducts();
};
window.editProduct=async function(id,name,description,price,category){
const n=prompt('নতুন পণ্যের নাম:',name);
if(n===null)return;
const d=prompt('নতুন বিবরণ:',description||'');
if(d===null)return;
const p=prompt('নতুন দাম:',price);
if(p===null||p.trim()===''||!Number.isFinite(Number(p))||Number(p)<0)return alert('সঠিক দাম দিন');
const c=prompt('নতুন ক্যাটাগরি:',category||'');
if(c===null)return;

const {error}=await supabase.from('products').update({
name:n.trim(),description:d.trim(),price:Number(p),category:c.trim()
}).eq('id',id);

if(error){alert(error.message);return;}
alert('পণ্য আপডেট হয়েছে');
await loadProducts();
};

window.deleteProduct=async function(id){
if(!confirm('পণ্যটি মুছে ফেলতে চান?'))return;
const {error}=await supabase.from('products').delete().eq('id',id);
if(error){alert(error.message);return;}
alert('পণ্য মুছে ফেলা হয়েছে');
await loadProducts();
};window.loadOrders = async function(){
const box=document.getElementById('orders');
box.textContent='অর্ডার লোড হচ্ছে...';

const {data,error}=await supabase
.from('orders')
.select('*')
.order('id',{ascending:false});

if(error){
box.textContent='অর্ডার লোড হয়নি: '+error.message;
return;
}

box.innerHTML='';

if(!data.length){
box.textContent='এখনো কোনো অর্ডার নেই।';
return;
}

data.forEach(o=>{
const item=document.createElement('div');
item.className='product';

const info=document.createElement('p');
info.textContent=
'অর্ডার #'+o.id+
' | কাস্টমার: '+o.customer_name+
' | ফোন: '+o.phone+
' | ঠিকানা: '+o.address+
' | পণ্য ID: '+o.product_id+
' | পরিমাণ: '+o.quantity+
' | মোট: '+o.total_amount+' টাকা'+
' | অবস্থা: '+o.status;

item.appendChild(info);

const select=document.createElement('select');

['নতুন','নিশ্চিত','প্রস্তুত','পাঠানো','সম্পন্ন','বাতিল'].forEach(s=>{
const option=document.createElement('option');
option.value=s;
option.textContent=s;
if(o.status===s) option.selected=true;
select.appendChild(option);
});

item.appendChild(select);

const btn=document.createElement('button');
btn.textContent='স্ট্যাটাস সেভ করুন';

btn.onclick=async()=>{
const {error}=await supabase
.from('orders')
.update({status:select.value})
.eq('id',o.id);

if(error){alert('সেভ হয়নি: '+error.message);return;}
alert('অর্ডারের স্ট্যাটাস পরিবর্তন হয়েছে!');
await window.loadOrders();
};

item.appendChild(btn);
box.appendChild(item);
});
};
async function loadProducts(){
const box=document.getElementById('products');
const {data,error}=await supabase.from('products')
.select('*').order('id',{ascending:false});

if(error){box.textContent='পণ্য লোড হয়নি: '+error.message;return;}
box.innerHTML='';
if(!data.length){box.textContent='এখনো কোনো পণ্য যোগ করা হয়নি।';return;}

data.forEach(p=>{
const item=document.createElement('div');
item.className='product';
const title=document.createElement('h4');
title.textContent=p.name;
item.appendChild(title);

if(p.image_url){
const img=document.createElement('img');
img.src=p.image_url;
img.alt=p.name;
item.appendChild(img);
}

const details=document.createElement('p');
details.textContent='দাম: '+p.price+' টাকা';
item.appendChild(details);

const desc=document.createElement('p');
desc.textContent=p.description||'';
item.appendChild(desc);const edit=document.createElement('button');
edit.textContent='এডিট করুন';
edit.onclick=()=>window.editProduct(p.id,p.name,p.description,p.price,p.category);
item.appendChild(edit);

const del=document.createElement('button');
del.textContent='মুছে ফেলুন';
del.style.background='#c62828';
del.onclick=()=>window.deleteProduct(p.id);
item.appendChild(del);
box.appendChild(item);
});
}

const {data:{session}}=await supabase.auth.getSession();
if(session) await showPanel();
</script>
</body>
</html>
