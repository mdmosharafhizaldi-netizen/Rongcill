
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রঙচিল | স্বপ্নের ছোঁয়া</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8fc;color:#333}
header{background:#7b2d68;color:white;text-align:center;padding:25px 12px}
header h1{margin:0;font-size:34px}
header p{margin:8px 0}
.container{max-width:1050px;margin:auto;padding:15px}
h2{text-align:center;color:#7b2d68}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:white;border-radius:13px;padding:14px;box-shadow:0 2px 12px #ddd}
.card img{width:100%;height:210px;object-fit:contain;border-radius:8px}
.card h3{color:#7b2d68}
.price{font-size:20px;font-weight:bold;color:#d63384}
.stock{color:#23833b}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{background:#7b2d68;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{background:#999;cursor:not-allowed}
.whatsapp{background:#159447}
.payment-info{background:#fff0f7;padding:10px;border-radius:7px;color:#7b2d68;font-size:14px;margin:8px 0}
#message{text-align:center;font-weight:bold}
footer{background:#7b2d68;color:white;text-align:center;padding:22px;margin-top:30px}
a{color:#7b2d68}
</style>
</head>
<body>

<header>
<h1>রঙচিল</h1>
<p>স্বপ্নের ছোঁয়া</p>
<p>আপনার পছন্দের পণ্য, আপনার হাতেই</p>
</header>

<div class="container">
<h2>আমাদের পণ্যসমূহ</h2>
<p id="message">পণ্য লোড হচ্ছে...</p>
<div class="products" id="products"></div>
</div>

<footer>
<h3>রঙচিল | স্বপ্নের ছোঁয়া</h3>
<p>অর্ডার: 01611385067</p>
<p>ধন্যবাদ আমাদের সঙ্গে থাকার জন্য।</p>
</footer>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://fstxhzsvvzthqqcisfdz.supabase.co';
const SUPABASE_KEY='sb_publishable_k8cAOGYerAOOFsf_UghhyQ_WfVu8buP';
const WHATSAPP='8801611385067';

/* নিজের পেমেন্ট নম্বর এখানে বসাবেন */
const PAYMENT_NUMBERS={
 'বিকাশ':'01406801565',
 'নগদ':'01611385067',
 'রকেট':'01406801565'
};

const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const productsBox=document.getElementById('products');
const message=document.getElementById('message');

function make(tag,text,className){
 const x=document.createElement(tag);
 if(text!==undefined)x.textContent=text;
 if(className)x.className=className;
 return x;
}

async function loadProducts(){
 message.textContent='পণ্য লোড হচ্ছে...';
 productsBox.replaceChildren();

 const {data,error}=await supabase
 .from('products')
 .select('id,name,description,price,stock,category,image_url,video_url')
 .eq('is_active',true)
 .order('id',{ascending:false});

 if(error){
  message.textContent='পণ্য লোড হয়নি। আবার চেষ্টা করুন।';
  console.error(error);
  return;
 }

 if(!data||data.length===0){
  message.textContent='এখনো কোনো পণ্য পাওয়া যায়নি।';
  return;
 }

 message.textContent='';

 data.forEach(p=>{
  const card=make('div',undefined,'card');

  if(p.image_url){
   const img=make('img');
   img.src=p.image_url;
   img.alt=p.name;
   card.appendChild(img);
  }

  card.appendChild(make('h3',p.name));
  if(p.category)card.appendChild(make('p','ক্যাটাগরি: '+p.category));
  if(p.description)card.appendChild(make('p',p.description));
  card.appendChild(make('p','দাম: '+p.price+' টাকা','price'));

  const stock=Number(p.stock);
  card.appendChild(make('p','স্টক: '+stock+' টি','stock'));

  if(p.video_url){
   const video=make('a','ভিডিও দেখুন');
   video.href=p.video_url;
   video.target='_blank';
   video.rel='noopener';
   card.appendChild(video);
  }

  const name=make('input');
  name.placeholder='আপনার নাম';
  name.autocomplete='name';

  const phone=make('input');
  phone.placeholder='মোবাইল নম্বর';
  phone.type='tel';
  phone.autocomplete='tel';

  const address=make('textarea');
  address.placeholder='সম্পূর্ণ ঠিকানা';

  const quantity=make('input');
  quantity.type='number';
  quantity.min='1';
  quantity.max=String(Math.min(stock,100));
  quantity.value='1';
  quantity.placeholder='পরিমাণ';

  const payment=make('select');

  [
   ['ক্যাশ অন ডেলিভারি','ক্যাশ অন ডেলিভারি'],
   ['বিকাশ','বিকাশ'],
   ['নগদ','নগদ'],
   ['রকেট','রকেট']
  ].forEach(([value,label])=>{
   const option=make('option',label);
   option.value=value;
   payment.appendChild(option);
  });

  const cardOption=make('option','কার্ড পেমেন্ট (শিগগিরই চালু হবে)');
  cardOption.disabled=true;
  payment.appendChild(cardOption);

  const paymentInfo=make('div',undefined,'payment-info');
  paymentInfo.textContent='পণ্য হাতে পেয়ে টাকা পরিশোধ করুন।';

  const transaction=make('input');
  transaction.placeholder='Transaction ID লিখুন';
  transaction.style.display='none';

  payment.onchange=()=>{
   const method=payment.value;

   if(method==='ক্যাশ অন ডেলিভারি'){
    paymentInfo.textContent='পণ্য হাতে পেয়ে টাকা পরিশোধ করুন।';
    transaction.style.display='none';
   }else{
    paymentInfo.textContent=
     method+' নম্বর: '+PAYMENT_NUMBERS[method]+
     '। টাকা পাঠিয়ে Transaction ID দিন।';
    transaction.style.display='block';
   }
  };

  const orderButton=make('button','ওয়েবসাইট থেকে অর্ডার করুন');
  const whatsappButton=make('button','WhatsApp-এ অর্ডার করুন','whatsapp');

  if(!Number.isInteger(stock)||stock<1){
   orderButton.disabled=true;
   whatsappButton.disabled=true;
   quantity.disabled=true;
   card.appendChild(make('p','স্টক শেষ','stock'));
  }

  orderButton.onclick=async()=>{
   const customer=name.value.trim();
   const mobile=phone.value.trim();
   const location=address.value.trim();
   const q=Number(quantity.value);
   const method=payment.value;
   const trx=transaction.value.trim();

   if(!customer||!mobile||!location){
    alert('নাম, মোবাইল ও ঠিকানা পূরণ করুন');
    return;
   }

   if(!Number.isInteger(q)||q<1||q>100||q>stock){
    alert('সঠিক পরিমাণ দিন। পর্যাপ্ত স্টক নেই।');
    return;
   }

   if(method!=='ক্যাশ অন ডেলিভারি'&&trx.length<4){
    alert('Transaction ID লিখুন');
    return;
   }

   if(method!=='ক্যাশ অন ডেলিভারি'&&
      PAYMENT_NUMBERS[method].includes('এখানে')){
    alert('আগে নিজের '+method+' নম্বর কোডে বসান।');
    return;
   }

   orderButton.disabled=true;
   orderButton.textContent='অর্ডার হচ্ছে...';

   try{
    const {data,error}=await supabase.rpc('place_order',{
     p_product_id:p.id,
     p_customer_name:customer,
     p_phone:mobile,
     p_address:location,
     p_quantity:q,
     p_payment_method:method,
     p_transaction_id:method==='ক্যাশ অন ডেলিভারি'?null:trx
    });

    if(error)throw error;

    const result=Array.isArray(data)?data[0]:data;

    alert(
     'অর্ডার সফল হয়েছে!'+
     '\nঅর্ডার নম্বর: '+result.order_id+
     '\nমোট টাকা: '+result.total_amount+' টাকা'+
     '\nপেমেন্ট: '+method+
     '\nপেমেন্ট যাচাই করে অর্ডার নিশ্চিত করা হবে।'
    );

    await loadProducts();

   }catch(error){
    alert('অর্ডার হয়নি: '+error.message);
    orderButton.disabled=false;
    orderButton.textContent='ওয়েবসাইট থেকে অর্ডার করুন';
   }
  };

  whatsappButton.onclick=()=>{
   const customer=name.value.trim();
   const mobile=phone.value.trim();
   const location=address.value.trim();
   const q=Number(quantity.value);

   if(!customer||!mobile||!location){
    alert('নাম, মোবাইল ও ঠিকানা পূরণ করুন');
    return;
   }

   if(!Number.isInteger(q)||q<1||q>stock){
    alert('সঠিক পরিমাণ দিন');
    return;
   }

   const text=
    'রঙচিল থেকে অর্ডার করতে চাই।\n'+
    'পণ্য: '+p.name+'\n'+
    'দাম: '+p.price+' টাকা\n'+
    'পরিমাণ: '+q+'\n'+
    'পেমেন্ট: '+payment.value+'\n'+
    'নাম: '+customer+'\n'+
    'মোবাইল: '+mobile+'\n'+
    'ঠিকানা: '+location;

   window.open(
    'https://wa.me/'+WHATSAPP+
    '?text='+encodeURIComponent(text),
    '_blank'
   );
  };

  card.appendChild(name);
  card.appendChild(phone);
  card.appendChild(address);
  card.appendChild(quantity);
  card.appendChild(make('p','পেমেন্ট পদ্ধতি নির্বাচন করুন'));
  card.appendChild(payment);
  card.appendChild(paymentInfo);
  card.appendChild(transaction);
  card.appendChild(orderButton);
  card.appendChild(whatsappButton);

  productsBox.appendChild(card);
 });
}

loadProducts();
</script>
</body>
</html>
