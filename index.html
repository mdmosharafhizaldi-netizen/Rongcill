
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রঙচিল | স্বপ্নের ছোঁয়া</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff8fc;color:#333}
header{background:#7b2d68;color:white;text-align:center;padding:25px 12px}
header h1{margin:0;font-size:32px}
header p{margin:8px 0 0}
.container{max-width:1000px;margin:auto;padding:15px}
h2{color:#7b2d68;text-align:center}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{background:white;border-radius:12px;padding:13px;box-shadow:0 2px 10px #ddd}
.card img{width:100%;height:190px;object-fit:contain;border-radius:8px}
.card h3{color:#7b2d68;margin-bottom:5px}
.price{font-size:19px;font-weight:bold;color:#d63384}
.stock{color:#287a37}
input,textarea,button{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:7px;font-size:15px}
button{border:0;background:#7b2d68;color:white;font-weight:bold;cursor:pointer}
.whatsapp{background:#159447}
button:disabled{background:#999}
#message{text-align:center;font-weight:bold}
footer{text-align:center;padding:20px;background:#7b2d68;color:white;margin-top:25px}
</style>
</head>
<body>

<header>
<h1>রঙচিল</h1>
<p>স্বপ্নের ছোঁয়া</p>
<p>আপনার পছন্দের পণ্য, আপনার হাতেই</p>
</header>

<div class="container">
<h2>আমাদের পণ্যসমূহ</h2>
<p id="message">পণ্য লোড হচ্ছে...</p>
<div class="products" id="products"></div>
</div>

<footer>
<p>রঙচিল | স্বপ্নের ছোঁয়া</p>
<p>অর্ডার করতে WhatsApp ব্যবহার করুন</p>
</footer>

<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL='https://fstxhzsvvzthqqcisfdz.supabase.co';
const SUPABASE_KEY='sb_publishable_k8cAOGYerAOOFsf_UghhyQ_WfVu8buP';
const WHATSAPP='8801611385067';

const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const productsBox=document.getElementById('products');
const message=document.getElementById('message');

function makeElement(tag,text,className){
 const el=document.createElement(tag);
 if(text!==undefined)el.textContent=text;
 if(className)el.className=className;
 return el;
}

async function loadProducts(){
 message.textContent='পণ্য লোড হচ্ছে...';
 productsBox.replaceChildren();

 const {data,error}=await supabase
  .from('products')
  .select('id,name,description,price,stock,category,image_url,video_url')
  .eq('is_active',true)
  .order('id',{ascending:false});

 if(error){
  message.textContent='পণ্য লোড হয়নি। আবার চেষ্টা করুন।';
  console.error(error);
  return;
 }

 if(!data||data.length===0){
  message.textContent='এখনো কোনো পণ্য পাওয়া যায়নি।';
  return;
 }

 message.textContent='';

 data.forEach(p=>{
  const card=makeElement('div',undefined,'card');

  if(p.image_url){
   const img=makeElement('img');
   img.src=p.image_url;
   img.alt=p.name;
   card.appendChild(img);
  }

  card.appendChild(makeElement('h3',p.name));
  if(p.category)card.appendChild(makeElement('p','ক্যাটাগরি: '+p.category));
  if(p.description)card.appendChild(makeElement('p',p.description));
  card.appendChild(makeElement('p','দাম: '+p.price+' টাকা','price'));

  const stock=Number(p.stock);
  card.appendChild(makeElement('p',
   'স্টক: '+(p.stock===null?'নির্ধারিত নয়':stock+' টি'),
   'stock'
  ));

  if(p.video_url){
   const video=makeElement('a','ভিডিও দেখুন');
   video.href=p.video_url;
   video.target='_blank';
   video.rel='noopener';
   card.appendChild(video);
  }

  const name=makeElement('input');
  name.placeholder='আপনার নাম';
  name.autocomplete='name';

  const phone=makeElement('input');
  phone.placeholder='মোবাইল নম্বর';
  phone.type='tel';
  phone.autocomplete='tel';

  const address=makeElement('textarea');
  address.placeholder='সম্পূর্ণ ঠিকানা';

  const quantity=makeElement('input');
  quantity.type='number';
  quantity.min='1';
  quantity.max=String(Math.min(stock||1,100));
  quantity.value='1';
  quantity.placeholder='পরিমাণ';

  const orderButton=makeElement('button','ওয়েবসাইট থেকে অর্ডার করুন');
  const whatsappButton=makeElement('button','WhatsApp-এ অর্ডার করুন','whatsapp');

  if(!Number.isInteger(stock)||stock<1){
   orderButton.disabled=true;
   whatsappButton.disabled=true;
   quantity.disabled=true;
   card.appendChild(makeElement('p','স্টক শেষ','stock'));
  }

  orderButton.onclick=async()=>{
   const customerName=name.value.trim();
   const customerPhone=phone.value.trim();
   const customerAddress=address.value.trim();
   const q=Number(quantity.value);

   if(!customerName||!customerPhone||!customerAddress){
    alert('নাম, মোবাইল ও ঠিকানা পূরণ করুন');
    return;
   }

   if(!Number.isInteger(q)||q<1||q>100){
    alert('সঠিক পরিমাণ দিন');
    return;
   }

   orderButton.disabled=true;
   orderButton.textContent='অর্ডার হচ্ছে...';

   try{
    const {data,error}=await supabase.rpc('place_order',{
     p_product_id:p.id,
     p_customer_name:customerName,
     p_phone:customerPhone,
     p_address:customerAddress,
     p_quantity:q
    });

    if(error)throw error;

    const result=Array.isArray(data)?data[0]:data;
    alert('অর্ডার সফল হয়েছে!\nঅর্ডার নম্বর: '+result.order_id+
     '\nমোট টাকা: '+result.total_amount);

    await loadProducts();
   }catch(error){
    alert('অর্ডার হয়নি: '+error.message);
    orderButton.disabled=false;
    orderButton.textContent='ওয়েবসাইট থেকে অর্ডার করুন';
   }
  };

  whatsappButton.onclick=()=>{
   const customerName=name.value.trim();
   const customerPhone=phone.value.trim();
   const customerAddress=address.value.trim();
   const q=Number(quantity.value);

   if(!customerName||!customerPhone||!customerAddress){
    alert('নাম, মোবাইল ও ঠিকানা পূরণ করুন');
    return;
   }
   if(!Number.isInteger(q)||q<1||q>100){
    alert('সঠিক পরিমাণ দিন');
    return;
   }

   const text='রঙচিল থেকে অর্ডার করতে চাই।\n'+
    'পণ্য: '+p.name+'\n'+
    'পণ্যের ID: '+p.id+'\n'+
    'দাম: '+p.price+' টাকা\n'+
    'পরিমাণ: '+q+'\n'+
    'নাম: '+customerName+'\n'+
    'মোবাইল: '+customerPhone+'\n'+
    'ঠিকানা: '+customerAddress;

   window.open('https://wa.me/'+WHATSAPP+
    '?text='+encodeURIComponent(text),'_blank');
  };

  card.appendChild(name);
  card.appendChild(phone);
  card.appendChild(address);
  card.appendChild(quantity);
  card.appendChild(orderButton);
  card.appendChild(whatsappButton);

  productsBox.appendChild(card);
 });
}

loadProducts();
</script>
</body>
</html>
